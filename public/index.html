<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- =========================================
         BASIC META
    ========================================== -->

    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#2E7D32"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="language"
      content="English"
    />

    <!-- =========================================
         WEBSITE TITLE
    ========================================== -->

    <title>
      Fit Fusion Club | Fitness & Wellness Centre
    </title>


    <!-- =========================================
         SEO DESCRIPTION
    ========================================== -->

    <meta
      name="description"
      content="Fit Fusion Club is a fitness and wellness centre dedicated to helping you achieve a healthier, stronger and more balanced lifestyle through personalized fitness and wellness programs."
    />


    <!-- =========================================
         SEO KEYWORDS
    ========================================== -->

    <meta
      name="keywords"
      content="Fit Fusion Club, fitness centre, wellness centre, fitness, wellness, weight loss, weight gain, nutrition, fitness programs, personal training, health and wellness, fitness coaching"
    />


    <!-- =========================================
         AUTHOR
    ========================================== -->

    <meta
      name="author"
      content="Fit Fusion Club"
    />


    <!-- =========================================
         CANONICAL URL
    ========================================== -->

    <link
      rel="canonical"
      href="https://fitfusionclub.com/"
    />


    <!-- =========================================
         FAVICON
    ========================================== -->

    <link
      rel="icon"
      href="%PUBLIC_URL%/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo.png"
    />

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />


    <!-- =========================================
         OPEN GRAPH
         Facebook / WhatsApp / LinkedIn
    ========================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://fitfusionclub.com/"
    />

    <meta
      property="og:title"
      content="Fit Fusion Club | Fitness & Wellness Centre"
    />

    <meta
      property="og:description"
      content="Build a healthier, stronger and happier lifestyle with Fit Fusion Club. Explore personalized fitness, nutrition and wellness programs."
    />

    <meta
      property="og:image"
      content="https://fitfusionclub.com/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Fit Fusion Club Logo"
    />

    <meta
      property="og:site_name"
      content="Fit Fusion Club"
    />


    <!-- =========================================
         TWITTER / X
    ========================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Fit Fusion Club | Fitness & Wellness Centre"
    />

    <meta
      name="twitter:description"
      content="Personalized fitness, nutrition and wellness programs designed to help you live a healthier lifestyle."
    />

    <meta
      name="twitter:image"
      content="https://fitfusionclub.com/logo.png"
    />


    <!-- =========================================
         FONTS
    ========================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>


  <body>

    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>


    <div id="root"></div>

  </body>
</html>
