<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- =====================================================
         BASIC META
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#2E7D32"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="language"
      content="English"
    />

    <meta
      name="author"
      content="Fit Fusion Club"
    />

    <!-- =====================================================
         SEO TITLE
    ====================================================== -->

    <title>
      Fit Fusion Club | Weight Loss & Fitness Centre
    </title>

    <!-- =====================================================
         SEO DESCRIPTION
    ====================================================== -->

    <meta
      name="description"
      content="Fit Fusion Club helps you achieve healthy weight loss, fitness and wellness through personalized training, nutrition guidance and expert fitness programs."
    />

    <!-- =====================================================
         SEO KEYWORDS
    ====================================================== -->

    <meta
      name="keywords"
      content="weight loss, weight loss program, weight loss centre, fitness centre, fitness club, Fit Fusion Club, personal training, weight loss training, nutrition coaching, fitness coaching, wellness centre, weight gain, healthy lifestyle"
    />

    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://fitfusionclub.com/"
    />

    <!-- =====================================================
         FAVICON
         Vite / React public folder
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://fitfusionclub.com/"
    />

    <meta
      property="og:title"
      content="Fit Fusion Club | Weight Loss & Fitness Centre"
    />

    <meta
      property="og:description"
      content="Achieve healthy weight loss and a stronger lifestyle with personalized fitness training, nutrition guidance and wellness programs at Fit Fusion Club."
    />

    <meta
      property="og:image"
      content="https://fitfusionclub.com/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Fit Fusion Club - Weight Loss and Fitness Centre"
    />

    <meta
      property="og:site_name"
      content="Fit Fusion Club"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Fit Fusion Club | Weight Loss & Fitness Centre"
    />

    <meta
      name="twitter:description"
      content="Personalized weight loss, fitness, nutrition and wellness programs designed to help you achieve a healthier lifestyle."
    />

    <meta
      name="twitter:image"
      content="https://fitfusionclub.com/logo.png"
    />

    <!-- =====================================================
         GOOGLE FONT CONNECTION
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================
         HEALTH CLUB SCHEMA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthClub",
        "name": "Fit Fusion Club",
        "url": "https://fitfusionclub.com/",
        "logo": "https://fitfusionclub.com/logo.png",
        "description": "Fit Fusion Club provides personalized weight loss, fitness, nutrition and wellness programs.",
        "sameAs": []
      }
    </script>

    <!-- =====================================================
         WEBSITE SCHEMA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Fit Fusion Club",
        "url": "https://fitfusionclub.com/"
      }
    </script>

  </head>

  <body>

    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
