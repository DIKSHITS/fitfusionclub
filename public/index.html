<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- =====================================================
         BASIC META
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#2E7D32"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="language"
      content="English"
    />

    <meta
      name="author"
      content="Fit Fusion Club"
    />

    <!-- =====================================================
         SEO TITLE
    ====================================================== -->

    <title>
      Fit Fusion Club | Weight Loss &amp; Fitness Centre
    </title>

    <!-- =====================================================
         SEO DESCRIPTION
    ====================================================== -->

    <meta
      name="description"
      content="Fit Fusion Club helps you achieve healthy weight loss, fitness and wellness through personalized training, nutrition guidance and expert fitness programs."
    />

    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://fitfusionclub.com/"
    />

    <!-- =====================================================
         LLMS.TXT
    ====================================================== -->

    <link
      rel="llms-txt"
      href="/llms.txt"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

    <!-- =====================================================
         WEB APP MANIFEST
    ====================================================== -->

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://fitfusionclub.com/"
    />

    <meta
      property="og:title"
      content="Fit Fusion Club | Weight Loss &amp; Fitness Centre"
    />

    <meta
      property="og:description"
      content="Achieve healthy weight loss and a stronger lifestyle with personalized fitness training, nutrition guidance and wellness programs at Fit Fusion Club."
    />

    <meta
      property="og:image"
      content="https://fitfusionclub.com/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Fit Fusion Club - Weight Loss and Fitness Centre"
    />

    <meta
      property="og:site_name"
      content="Fit Fusion Club"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Fit Fusion Club | Weight Loss &amp; Fitness Centre"
    />

    <meta
      name="twitter:description"
      content="Personalized weight loss, fitness, nutrition and wellness programs designed to help you achieve a healthier lifestyle."
    />

    <meta
      name="twitter:image"
      content="https://fitfusionclub.com/logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="Fit Fusion Club - Weight Loss and Fitness Centre"
    />

    <!-- =====================================================
         GOOGLE FONT PERFORMANCE
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================
         LOCAL BUSINESS / HEALTH CLUB SCHEMA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthClub",
        "@id": "https://fitfusionclub.com/#healthclub",
        "name": "Fit Fusion Club",
        "url": "https://fitfusionclub.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://fitfusionclub.com/logo.png"
        },
        "image": "https://fitfusionclub.com/logo.png",
        "description": "Fit Fusion Club provides personalized weight loss, fitness, nutrition and wellness programs.",
        "telephone": "+91 9007089970",
        "email": "fusionfitness365@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1c/ Kustia Rd, Picnic Garden, opposite Merlin Island Building, Tiljala",
          "addressLocality": "Kolkata",
          "addressRegion": "West Bengal",
          "postalCode": "700039",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.instagram.com/fusion_fitness24/"
        ]
      }
    </script>

    <!-- =====================================================
         WEBSITE SCHEMA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://fitfusionclub.com/#website",
        "name": "Fit Fusion Club",
        "url": "https://fitfusionclub.com/",
        "description": "Fit Fusion Club - Weight Loss, Fitness, Nutrition and Wellness Centre",
        "publisher": {
          "@id": "https://fitfusionclub.com/#healthclub"
        },
        "inLanguage": "en-IN"
      }
    </script>
  </head>

  <body>

    <!-- =====================================================
         NOSCRIPT
    ====================================================== -->

    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <!-- =====================================================
         REACT ROOT
    ====================================================== -->

    <div id="root"></div>

    <!-- =====================================================
         VITE / REACT ENTRY
    ====================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
